<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海棠春 - 剧本库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#E94560', // 主色调：红色，代表悬疑和激情
                        secondary: '#1A1A2E', // 辅助色：深蓝，代表神秘感
                        tertiary: '#16213E', // 第三色：暗蓝，代表沉浸感
                        accent: '#FFC107', // 强调色：金色，代表重要元素
                        neutral: '#F5F5F5', // 中性色：浅灰，用于背景
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                        'card-hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                },
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities { .content-auto { content-visibility: auto; } .text-shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.3); } .text-shadow-lg { text-shadow: 0 4px 8px rgba(0,0,0,0.5); } .bg-gradient-overlay { background: linear-gradient(to bottom, rgba(0,0,0,0.2),
        rgba(0,0,0,0.7)); } .scrollbar-hide::-webkit-scrollbar { display: none; } .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; } }
    </style>
</head>

<body class="font-inter bg-neutral text-gray-800 min-h-screen flex flex-col">
    <!-- 导航栏 -->
    <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" id="navbar">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <span class="text-primary text-2xl sm:text-3xl"><img src="logo.jpg" alt="剧本杀图标" class="h-8 w-auto"></span>
                    <span class="text-xl sm:text-2xl font-bold text-white">剧本杀之家</span>
                </div>

                <!-- 桌面导航 -->
                <nav class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-white hover:text-primary transition-colors font-medium">首页</a>
                    <a href="script-library.html" class="text-white hover:text-primary transition-colors font-medium">剧本库</a>
                    <a href="session-hall.html" class="text-white hover:text-primary transition-colors font-medium">组局大厅</a>
                    <a href="creator-platform.html" class="text-white hover:text-primary transition-colors font-medium">创作者平台</a>
                    <a href="#" class="text-white hover:text-primary transition-colors font-medium">新手教程</a>
                    <a href="about-us.html" class="text-white hover:text-primary transition-colors font-medium">关于我们</a>
                </nav>

                <!-- 用户操作区 -->
                <div class="flex items-center space-x-4">
                    <div class="relative hidden sm:block">
                        <input type="text" placeholder="搜索剧本..." class="bg-white/10 backdrop-blur-sm text-white placeholder-white/60 pl-10 pr-4 py-2 rounded-full w-48 lg:w-64 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all">
                        <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-white/60"></i>
                    </div>
                    <button id="loginButton" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-full transition-all flex items-center space-x-1">
                        <i class="fa fa-user-circle"></i>
                        <span class="hidden sm:inline">登录/注册</span>
                    </button>
                    <!-- 移动端菜单按钮 -->
                    <button id="mobileMenuButton" class="md:hidden text-white text-xl">
                        <i class="fa fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 移动端导航菜单 -->
        <div id="mobileMenu" class="md:hidden bg-secondary/95 backdrop-blur-md absolute w-full left-0 top-full transform -translate-y-full opacity-0 transition-all duration-300 pointer-events-none">
            <div class="container mx-auto px-4 py-4">
                <div class="flex flex-col space-y-4">
                    <a href="index.html" class="text-white hover:text-primary transition-colors font-medium py-2">首页</a>
                    <a href="script-library.html" class="text-white hover:text-primary transition-colors font-medium py-2">剧本库</a>
                    <a href="session-hall.html" class="text-white hover:text-primary transition-colors font-medium py-2">组局大厅</a>
                    <a href="#" class="text-white hover:text-primary transition-colors font-medium py-2">创作者平台</a>
                    <a href="#" class="text-white hover:text-primary transition-colors font-medium py-2">新手教程</a>
                    <a href="about-us.html" class="text-white hover:text-primary transition-colors font-medium py-2">关于我们</a>
                    <div class="relative mt-2">
                        <input type="text" placeholder="搜索剧本..." class="bg-white/10 backdrop-blur-sm text-white placeholder-white/60 pl-10 pr-4 py-2 rounded-full w-full focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all">
                        <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-white/60"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 登录模态框 -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full mx-4 transform scale-95 transition-transform duration-300">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">用户登录</h3>
                    <button id="closeModal" class="text-gray-500 hover:text-gray-800">
                        <i class="fa fa-times text-xl"></i>
                    </button>
                </div>
                <form class="space-y-4">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                <i class="fa fa-user"></i>
                            </span>
                            <input type="text" id="username" placeholder="请输入用户名" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                        </div>
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                <i class="fa fa-lock"></i>
                            </span>
                            <input type="password" id="password" placeholder="请输入密码" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                        </div>
                    </div>
                    <button type="button" class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-2 px-4 rounded-lg transition-all">登录</button>
                </form>
                <div class="mt-4 pt-4 border-t border-gray-200">
                    <p class="text-center text-sm text-gray-600">还没有账号？<a href="#" class="text-primary hover:underline">立即注册</a></p>
                    <div class="mt-4 flex justify-center space-x-4">
                        <button class="social-icon bg-[#07C160]/10 hover:bg-[#07C160]/20 text-[#07C160] p-2 rounded-full transition-all">
                            <i class="fa fa-weixin text-xl"></i>
                        </button>
                        <button class="social-icon bg-[#E6162D]/10 hover:bg-[#E6162D]/20 text-[#E6162D] p-2 rounded-full transition-all">
                            <i class="fa fa-weibo text-xl"></i>
                        </button>
                        <button class="social-icon bg-[#12B7F5]/10 hover:bg-[#12B7F5]/20 text-[#12B7F5] p-2 rounded-full transition-all">
                            <i class="fa fa-qq text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页面头部 -->
    <section class="relative h-60 bg-secondary overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-tertiary to-secondary opacity-90"></div>
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 relative z-10 h-full flex items-center">
            <div>
                <h1 class="text-[clamp(1.8rem,4vw,3rem)] font-bold text-white text-shadow-lg mb-2">剧本库</h1>
                <p class="text-white/80 text-lg max-w-2xl">探索超过1000+精选剧本，找到适合你的沉浸式推理体验</p>
            </div>
        </div>
    </section>

    <!-- 面包屑导航 -->
    <section class="py-4 bg-white">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center text-sm text-gray-500">
                <a href="index.html" class="hover:text-primary transition-colors">首页</a>
                <i class="fa fa-angle-right mx-2 text-gray-400"></i>
                <span class="text-gray-700">剧本库</span>
            </div>
        </div>
    </section>

    <!-- 剧本筛选区 -->
    <section class="py-8 bg-white">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-gray-50 rounded-xl shadow-sm p-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">剧本类型</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                            <option value="">全部类型</option>
                            <option value="hardcore">硬核推理</option>
                            <option value="emotional">情感沉浸</option>
                            <option value="happy">欢乐机制</option>
                            <option value="horror">恐怖惊悚</option>
                            <option value="other">其他类型</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">玩家人数</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                            <option value="">全部人数</option>
                            <option value="4">4人</option>
                            <option value="5">5人</option>
                            <option value="6">6人</option>
                            <option value="7">7人</option>
                            <option value="8">8人</option>
                            <option value="9+">9人以上</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">游戏时长</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                            <option value="">全部时长</option>
                            <option value="2">2小时以内</option>
                            <option value="4">3-4小时</option>
                            <option value="5">5小时以上</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">难度级别</label>
                        <div class="flex flex-wrap gap-2">
                            <button class="filter-tag px-4 py-2 bg-primary text-white rounded-full transition-all">全部</button>
                            <button class="filter-tag px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full transition-all">新手</button>
                            <button class="filter-tag px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full transition-all">进阶</button>
                            <button class="filter-tag px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full transition-all">烧脑</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">价格区间</label>
                        <input type="range" min="0" max="200" value="100" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                        <div class="flex justify-between text-xs text-gray-500 mt-1">
                            <span>0元</span>
                            <span>100元</span>
                            <span>200元</span>
                        </div>
                    </div>
                </div>
                <div class="flex flex-wrap justify-end gap-3 mt-6">
                    <button class="filter-button px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-all">重置条件</button>
                    <button class="filter-button px-6 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all">筛选剧本</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 排序和视图切换 -->
    <section class="py-6 bg-white">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-4">
                    <span class="text-gray-500">找到 <span class="font-medium text-gray-800">248</span> 个剧本</span>
                    <div class="relative">
                        <select class="pl-4 pr-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm">
                            <option value="recommend">推荐排序</option>
                            <option value="rating">评分优先</option>
                            <option value="newest">最新上线</option>
                            <option value="popular">热门程度</option>
                            <option value="price-asc">价格从低到高</option>
                            <option value="price-desc">价格从高到低</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button class="view-button p-2 bg-primary text-white rounded-lg transition-all">
                        <i class="fa fa-th-large"></i>
                    </button>
                    <button class="view-button p-2 bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-lg transition-all">
                        <i class="fa fa-list"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 剧本列表 -->
    <section class="py-8 bg-white">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- 剧本卡片 1 -->
                <div class="script-card bg-white rounded-xl overflow-hidden shadow-card hover:shadow-card-hover transition-all transform hover:-translate-y-1">
                    <div class="script-image h-48 overflow-hidden relative">
                        <img src="https://picsum.photos/id/237/600/400" alt="病娇男孩的精分日记" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
                        <div class="absolute top-3 left-3 bg-primary text-white text-xs px-2 py-1 rounded">热门</div>
                    </div>
                    <div class="script-info p-6">
                        <h3 class="script-title text-xl font-bold mb-2">病娇男孩的精分日记</h3>
                        <div class="script-meta flex items-center justify-between mb-3">
                            <span class="text-sm bg-gray-100 px-3 py-1 rounded-full">硬核推理</span>
                            <div class="flex items-center">
                                <i class="fa fa-star text-yellow-400"></i>
                                <span class="ml-1">4.8</span>
                            </div>
                        </div>
                        <p class="script-desc text-gray-600 text-sm mb-4 line-clamp-3">七个人格共用一个身体，当你们发现彼此的存在，一场精心设计的谋杀即将上演...</p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="text-sm text-gray-500">难度：</span>
                                <div class="flex">
                                    <i class="fa fa-circle text-primary text-xs"></i>
                                    <i class="fa fa-circle text-primary text-xs"></i>
                                    <i class="fa fa-circle text-primary text-xs"></i>
                                    <i class="fa fa-circle text-gray-300 text-xs"></i>
                                    <i class="fa fa-circle text-gray-300 text-xs"></i>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-sm text-gray-500">人数：</span>
                                <span>7人</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between mt-4">
                            <span class="text-lg font-bold text-primary">¥128/人</span>
                            <a href="#" class="script-button bg-primary/10 hover:bg-primary/20 text-primary font-medium py-2 px-4 rounded-lg transition-all">立即预约</a>
                        </div>
                    </div>
                </div>

                <!-- 剧本卡片 2 -->
                <div class="script-card bg-white rounded-xl overflow-hidden shadow-card hover:shadow-card-hover transition-all transform hover:-translate-y-1">
                    <div class="script-image h-48 overflow-hidden relative">
                        <img src="https://picsum.photos/id/239/600/400" alt="月下沙利叶" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
                        <div class="absolute top-3 left-3 bg-secondary text-white text-xs px-2 py-1 rounded">城限</div>
                    </div>
                    <div class="script-info p-6">
                        <h3 class="script-title text-xl font-bold mb-2">月下沙利叶</h3>
                        <div class="script-meta flex items-center justify-between mb-3">
                            <span class="text-sm bg-gray-100 px-3 py-1 rounded-full">恐怖惊悚</span>
                            <div class="flex items-center">
                                <i class="fa fa-star text-yellow-400"></i>
                                <span class="ml-1">4.9</span>
                            </div>
                        </div>
                        <p class="script-desc text-gray-600 text-sm mb-4 line-clamp-3">圣博杜安修道院的秘密，月光下的诡异仪式，你们能否揭开这背后的真相？</p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
